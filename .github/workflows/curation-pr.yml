name: Check independent curation PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  curation-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check curation ownership
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-curation-pr.mjs "$BASE_SHA" "$HEAD_SHA"
