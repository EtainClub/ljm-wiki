name: Publish approved event

on:
  push:
    branches: [main]
    paths:
      - ".automation/ready-events/*.json"
      - ".github/workflows/publish-ready.yml"
      - "scripts/publish-*.sh"
  workflow_dispatch:
  # 발행 실패 뒤 새 기사 PR이 없어도 승인된 대기열을 다시 처리한다.
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-approved-event
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 트리거한 커밋이 아니라 최신 main 을 받는다. 대기열에서 기다린 run 이 앞선
      # 발행 커밋을 놓치고 낡은 상태로 생성·lint 하는 일을 막는다.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 장기 서비스 계정 키 대신 GitHub OIDC로 짧은 자격증명을 받는다.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix functions ci

      # Firestore 를 바꾸는 단계는 marker 마다 한 번만 실행한다 (정정은 두 번 적용할 수 없다).
      # 앞선 run 이 이미 처리해 marker 가 없으면 할 일 없이 성공으로 끝낸다.
      - id: process
        name: Publish ready events
        shell: bash
        run: |
          processed="$RUNNER_TEMP/processed-events"
          bash scripts/publish-ready.sh "$processed"
          if [ ! -s "$processed" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "processed=$processed" >> "$GITHUB_OUTPUT"

      - name: Generate derived pages
        if: steps.process.outputs.skip != 'true'
        run: bash scripts/publish-regenerate.sh "${{ steps.process.outputs.processed }}"

      - name: Validate and build App Hosting app
        if: steps.process.outputs.skip != 'true'
        run: |
          npm --prefix functions run typecheck
          npm run lint
          npm run build

      # 실행 중에 main 이 앞서 나가면 push 가 거부된다. 그때는 최신 main 으로 옮겨
      # 파일 산출물만 다시 만든다. Firestore 는 이미 반영돼 있다.
      - name: Commit generated records
        if: steps.process.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "new-ljm publish bot"
          git config user.email "new-ljm-publish-bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add .automation sources wiki
            git diff --cached --quiet || git commit -m "publish: approved event"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 거부 (시도 $attempt). 최신 main 에서 다시 생성합니다."
            sleep $((attempt * 5))
            git fetch origin main
            git reset --hard origin/main
            bash scripts/publish-regenerate.sh "${{ steps.process.outputs.processed }}"
          done
          echo "push 를 5번 시도했지만 실패했습니다." >&2
          exit 1
