# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 512

# Environment variables and secrets.
env:
  # App Hosting의 정식 공개 주소. metadataBase·OG 이미지·공유 카드가 같은 주소를 쓴다.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://news.jamtong.kr
    availability:
      - BUILD
      - RUNTIME
