# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 20
  cpu: 1
  memoryMiB: 512

# Environment variables and secrets.
env:
  # App Hosting 기본 URL. metadataBase·OG 이미지·공유 카드가 같은 주소를 쓴다.
  # 커스텀 도메인을 연결할 때 이 값만 새 주소로 바꾼다.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://ljm-wiki--new-ljm.asia-east1.hosted.app
    availability:
      - BUILD
      - RUNTIME
